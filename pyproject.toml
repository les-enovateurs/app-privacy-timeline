[project]
name = "apklab"
version = "0.1.0"
description = "Analyse statique d'APK Android et historisation pour Unlock My Data"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21", "androguard>=4.1"]

[project.scripts]
apklab = "apklab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apklab"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
